[build-system]
requires = ["setuptools==70.2.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ibot-na"
version = "0.1.0"
description = "Reproducible experiments for information-bottlenecked optimal transport network alignment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "psutil==7.2.2",
    "scipy==1.18.0",
    "tensorboard==2.20.0",
    "torch==2.12.1",
    "torch-geometric==2.8.0",
    "tqdm==4.66.2",
]

[tool.setuptools.packages.find]
where = ["src"]
